[project]
name = "portfolio-assistant"
version = "0.1.0"
description = "LangGraph portfolio chatbot grounded in a resume and project write-ups"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.6.0",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.1",
]
