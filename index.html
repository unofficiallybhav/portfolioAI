<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask about Bhavyy</title>
<style>
  :root {
    --ground: #393837;
    --ground-deep: #2b2a29;
    --panel: rgba(255, 255, 255, 0.055);
    --panel-hover: rgba(255, 255, 255, 0.095);
    --line: rgba(255, 255, 255, 0.09);
    --ink: #ffffff;
    --ink-soft: rgba(255, 255, 255, 0.62);
    --ink-faint: rgba(255, 255, 255, 0.38);
    --accent: #758e97;
    --accent-deep: #5f767e;
    --accent-ink: #1e2528;
    --card: #ffffff;
    --good: #8fb0a4;
    --warn: #c2a878;
    --bad: #c08a7d;
    --sans: "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif;
    --rail: 268px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink);
    background: var(--ground-deep);
    -webkit-font-smoothing: antialiased;
  }

  /* Warm vignette: lighter toward the top centre, like the reference render. */
  .app {
    height: 100vh;
    height: 100dvh; /* dvh tracks mobile browser chrome, so the composer is never cut off */
    display: grid;
    grid-template-columns: var(--rail) 1fr;
    gap: 14px;
    padding: 14px;
    padding-left: max(14px, env(safe-area-inset-left));
    padding-right: max(14px, env(safe-area-inset-right));
    background:
      radial-gradient(120% 90% at 50% -10%, #4a4846 0%, rgba(74, 72, 70, 0) 60%),
      var(--ground);
  }

  button, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  button:disabled { cursor: default; opacity: .45; }

  .eyebrow {
    font-size: 10.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* ----------------------------------------------------------------- rail */

  .rail {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    backdrop-filter: blur(14px);
  }

  .brand {
    background: var(--card);
    color: var(--ground);
    border-radius: 22px;
    padding: 14px 14px 16px;
  }

  .brand-row { display: flex; align-items: center; gap: 10px; }

  .avatar {
    width: 30px; height: 30px; flex: none;
    border-radius: 50%;
    background: var(--ground);
    color: #fff;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 600;
  }

  .brand-name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .new-chat {
    margin-top: 14px;
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    background: var(--ground);
    color: #fff;
    border-radius: 999px;
    padding: 11px 16px;
    font-size: 14px;
    transition: background .15s;
  }
  .new-chat:hover:not(:disabled) { background: #4c4a48; }

  .nav { padding: 8px; }

  .nav a {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 11px;
    border-radius: 12px;
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 14px;
    transition: background .15s, color .15s;
  }
  .nav a:hover { background: var(--panel-hover); color: var(--ink); }
  .nav svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; }

  .projects {
    padding: 14px 8px 10px;
    min-height: 0;
    display: flex; flex-direction: column;
  }
  .projects .eyebrow { padding: 0 11px 8px; }

  .project-list { overflow-y: auto; min-height: 0; }

  .project {
    display: block; width: 100%;
    text-align: left;
    padding: 7px 11px;
    border-radius: 10px;
    font-size: 13.5px;
    color: var(--ink-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background .15s, color .15s;
  }
  .project:hover:not(:disabled) { background: var(--panel-hover); color: var(--ink); }

  .promo {
    margin-top: auto;
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 20px;
    padding: 16px 16px 17px;
  }
  .promo h3 { margin: 0 0 5px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .promo p { margin: 0; font-size: 13px; line-height: 1.45; color: rgba(30, 37, 40, .78); }

  /* ----------------------------------------------------------------- main */

  .main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }

  .topbar {
    flex: none;
    display: flex;
    padding: 10px 8px 12px;
    min-height: 28px;
  }

  #status { margin-left: auto; font-size: 12px; color: var(--ink-faint); white-space: nowrap; }

  .scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 0 8px 8px;
  }

  .scroll::-webkit-scrollbar, .project-list::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb, .project-list::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, .13); border-radius: 4px;
  }

  .wrap { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .turn { display: flex; flex-direction: column; max-width: 100%; }

  .turn.user { align-items: flex-end; }

  .turn .body {
    border-radius: 18px;
    padding: 12px 16px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .turn.user .body {
    background: rgba(255, 255, 255, .13);
    border-bottom-right-radius: 7px;
    max-width: 78%;
  }

  .turn.agent .body {
    background: rgba(0, 0, 0, .22);
    border: 1px solid var(--line);
    border-bottom-left-radius: 7px;
    color: rgba(255, 255, 255, .93);
  }

  .turn.error .body {
    background: rgba(192, 138, 125, .14);
    border: 1px solid rgba(192, 138, 125, .35);
    color: #e8bfb6;
  }

  .attached { display: block; margin-top: 6px; font-size: 12px; color: var(--ink-faint); }

  .caret::after { content: "▍"; color: var(--accent); animation: pulse 1s ease-in-out infinite; }

  .working {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 2px;
    color: var(--ink-faint);
    font-size: 13px;
  }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

  /* Fills the otherwise blank transcript until the first message is sent. */
  .empty { min-height: 58vh; display: grid; place-items: center; text-align: center; }
  .empty h2 {
    margin: 0;
    font-size: 36px;
    font-weight: 300;
    letter-spacing: -0.03em;
  }

  /* -------------------------------------------------------------- verdict */

  .verdict {
    background: rgba(0, 0, 0, .22);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 18px 20px 20px;
  }
  .verdict .role { margin-bottom: 14px; }
  .verdict .role strong { display: block; margin-top: 3px; font-weight: 500; }

  .gauge .row { display: flex; align-items: baseline; gap: 9px; }
  .gauge .score { font-size: 34px; font-weight: 300; letter-spacing: -0.03em; line-height: 1; }
  .gauge .rec { margin-left: auto; font-size: 13px; }

  .track { margin-top: 11px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .1); overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 2px; transition: width .7s cubic-bezier(.22, 1, .36, 1); }

  .skills { display: grid; gap: 14px; margin-top: 18px; }
  .skills h4 { margin: 0 0 8px; font-size: 11px; font-weight: 400; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-soft); }
  .chip.has { border-color: rgba(143, 176, 164, .5); color: var(--good); }

  /* ------------------------------------------------------------- composer */

  .composer-dock { flex: none; padding: 12px 8px max(4px, env(safe-area-inset-bottom)); }

  .composer {
    max-width: 780px;
    margin: 0 auto;
    background: var(--card);
    color: var(--ground);
    border-radius: 24px;
    padding: 14px 14px 12px;
    box-shadow: 0 12px 34px rgba(0, 0, 0, .3);
    border: 2px solid transparent;
    transition: border-color .15s;
  }
  .composer.drag { border-color: var(--accent); }

  .composer textarea {
    display: block; width: 100%;
    border: none; outline: none; resize: none; background: none;
    font-size: 16px; line-height: 1.5;
    max-height: 180px;
  }
  .composer textarea::placeholder { color: rgba(57, 56, 55, .45); }

  .composer-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }

  .tool {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid rgba(57, 56, 55, .22);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 13px;
    color: rgba(57, 56, 55, .8);
    transition: background .15s, border-color .15s;
  }
  .tool:hover:not(:disabled) { background: rgba(57, 56, 55, .06); border-color: rgba(57, 56, 55, .4); }

  .send {
    margin-left: auto;
    background: var(--ground);
    color: #fff;
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 14px;
    transition: background .15s;
  }
  .send:hover:not(:disabled) { background: #4c4a48; }

  .file-chip {
    display: none; align-items: center; gap: 6px;
    margin-bottom: 9px;
    font-size: 12.5px;
    padding: 4px 5px 4px 11px;
    border-radius: 999px;
    background: rgba(117, 142, 151, .2);
    color: #44565c;
    max-width: 100%;
  }
  .file-chip.on { display: inline-flex; }
  .file-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip button { color: inherit; padding: 0 5px; font-size: 15px; line-height: 1; }

  /* ------------------------------------------------------------ responsive */

  /* Hamburger and scrim exist only once the rail becomes a drawer. */
  .rail-toggle {
    display: none;
    align-items: center; justify-content: center;
    width: 40px; height: 40px;
    margin: -6px 0 -6px -6px;
    border-radius: 12px;
    color: var(--ink-soft);
  }
  .rail-toggle:hover { background: var(--panel-hover); color: var(--ink); }
  .rail-toggle svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; }

  .scrim {
    display: none;
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0, 0, 0, .55);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .scrim.on { opacity: 1; pointer-events: auto; }

  /* Narrow laptops and iPad landscape: keep the rail, just tighten it. */
  @media (max-width: 1100px) {
    :root { --rail: 236px; }
    .empty h2 { font-size: 30px; }
  }

  /* iPad portrait and below: the rail slides over instead of squeezing the chat. */
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; gap: 0; padding: 10px; }
    .rail-toggle { display: inline-flex; }
    .scrim { display: block; }

    .rail {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 30;
      width: min(310px, 86vw);
      padding: 12px;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: var(--ground);
      border-right: 1px solid var(--line);
      overflow-y: auto;
      overscroll-behavior: contain;
      transform: translateX(-102%);
      /* visibility keeps the closed drawer out of the tab order, not just off screen */
      visibility: hidden;
      transition: transform .26s cubic-bezier(.22, 1, .36, 1), visibility .26s;
    }
    .rail.open { transform: none; visibility: visible; }

    .project-list { overflow: visible; }
    .topbar { padding: 2px 0 10px; }
    .turn.user .body { max-width: 88%; }
  }

  /* Phones. */
  @media (max-width: 560px) {
    .app { padding: 8px; }
    .empty h2 { font-size: 26px; }
    .composer { border-radius: 20px; padding: 12px 12px 10px; }
    .turn .body { padding: 11px 14px; }
    .turn.user .body { max-width: 92%; }
    .verdict { padding: 16px; border-radius: 16px; }
    .gauge .score { font-size: 29px; }
    .gauge .rec { margin-left: 0; width: 100%; }
    .gauge .row { flex-wrap: wrap; }
  }

  /* Landscape phones: almost no vertical room, so stop reserving it. */
  @media (max-height: 560px) {
    .empty { min-height: 34vh; }
    .topbar { padding-bottom: 6px; }
  }

  /* Touch targets need more room than a cursor does. */
  @media (pointer: coarse) {
    .nav a { padding: 12px 11px; }
    .project { padding: 11px; }
    .tool, .send { padding-top: 10px; padding-bottom: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="app">

  <aside class="rail" id="rail">
    <div class="brand">
      <div class="brand-row">
        <div class="avatar" id="initial">B</div>
        <div class="brand-name" id="brandName">Bhavyy</div>
      </div>
      <button class="new-chat" id="reset">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
    </div>

    <nav class="panel nav" id="links"></nav>

    <div class="panel projects">
      <div class="eyebrow">Projects</div>
      <div class="project-list" id="projects"></div>
    </div>

    <div class="promo">
      <h3>Score a role</h3>
      <p>Attach or paste a job description and I'll rate the fit out of 100, gaps included.</p>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="rail-toggle" id="railToggle" aria-label="Open menu" aria-expanded="false" aria-controls="rail">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div id="status">connecting…</div>
    </div>

    <div class="scroll" id="scroll">
      <div class="wrap" id="transcript" aria-live="polite"></div>
    </div>

    <div class="composer-dock">
      <div class="composer" id="composer">
        <div class="file-chip" id="fileChip"><span id="fileName"></span><button id="fileClear" aria-label="Remove file">×</button></div>
        <textarea id="input" rows="1" placeholder="Ask anything…"></textarea>
        <div class="composer-foot">
          <button class="tool" id="attach" title="Attach a job description (.pdf, .docx, .md)">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            File
          </button>
          <input type="file" id="file" accept=".pdf,.docx,.md" hidden>
          <button class="send" id="send" disabled>Send</button>
        </div>
      </div>
    </div>
  </main>

</div>

<div class="scrim" id="scrim"></div>

<script>
const API = window.location.origin;
const MAX_FILE_BYTES = 5 * 1024 * 1024;
let sessionId = null;
let busy = false;
let lastVerdictKey = null;
let pendingFile = null;

const $ = id => document.getElementById(id);
const transcript = $("transcript"), scroll = $("scroll"), input = $("input");
const sendBtn = $("send"), resetBtn = $("reset"), statusTag = $("status");
const attachBtn = $("attach"), fileInput = $("file"), fileChip = $("fileChip"), fileName = $("fileName");

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

function icon(path) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", path);
  svg.append(p);
  return svg;
}

const LINK_GLYPH = "M10 14a4 4 0 0 0 6 .5l2-2a4 4 0 0 0-5.7-5.7l-1.1 1.1M14 10a4 4 0 0 0-6-.5l-2 2a4 4 0 0 0 5.7 5.7l1.1-1.1";

// Profile links the rail leaves out: a duplicate repo link and the portfolio site itself.
const HIDDEN_LINKS = new Set(["portfolio", "github repository"]);

function nearBottom() { return scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 80; }
function toBottom() { scroll.scrollTop = scroll.scrollHeight; }

// Safe rendering of the only markdown the bot uses, **bold**. Everything else stays plain text.
function renderInto(node, text) {
  node.textContent = "";
  text.split(/(\*\*[^*]+\*\*)/g).forEach(part => {
    if (part.length > 4 && part.startsWith("**") && part.endsWith("**")) node.append(el("strong", null, part.slice(2, -2)));
    else if (part) node.append(document.createTextNode(part));
  });
}

function addTurn(role, text) {
  const turn = el("div", "turn " + role);
  const body = el("div", "body");
  renderInto(body, text);
  turn.append(body);
  transcript.append(turn);
  toBottom();
  return { turn, body };
}

function scoreColor(n) { return n >= 70 ? "var(--good)" : n >= 45 ? "var(--warn)" : "var(--bad)"; }

function chipGroup(title, skills, cls) {
  const wrap = el("div");
  wrap.append(el("h4", null, title));
  const chips = el("div", "chips");
  skills.forEach(s => chips.append(el("span", "chip " + cls, s)));
  wrap.append(chips);
  return wrap;
}

function addVerdict(jd, match) {
  const card = el("div", "verdict");

  const role = el("div", "role");
  role.append(el("span", "eyebrow", "Measured against"));
  role.append(el("strong", null, (jd.role || "Unspecified role") + (jd.company ? " · " + jd.company : "")));
  card.append(role);

  const gauge = el("div", "gauge");
  const row = el("div", "row");
  const score = el("div", "score", String(match.score));
  score.style.color = scoreColor(match.score);
  const rec = el("span", "rec", match.recommendation_label || match.recommendation);
  rec.style.color = scoreColor(match.score);
  row.append(score, el("span", "eyebrow", "out of 100"), rec);
  gauge.append(row);
  const track = el("div", "track"), fill = el("div", "fill");
  fill.style.background = scoreColor(match.score);
  track.append(fill);
  gauge.append(track);
  card.append(gauge);

  const matched = match.matched_skills || [], missing = match.missing_skills || [];
  if (matched.length || missing.length) {
    const skills = el("div", "skills");
    if (matched.length) skills.append(chipGroup("On my resume", matched, "has"));
    if (missing.length) skills.append(chipGroup("Not on my resume", missing, "gap"));
    card.append(skills);
  }

  transcript.append(card);
  requestAnimationFrame(() => { fill.style.width = match.score + "%"; });
  toBottom();
}

function showEmptyState(firstName) {
  transcript.innerHTML = "";
  const box = el("div", "empty");
  box.append(el("h2", null, "Ask about " + (firstName || "Bhavyy")));
  transcript.append(box);
}

// Fills the rail from the profile the server reports, so nothing in it is invented.
function fillRail(candidate) {
  const name = candidate.name || "Bhavyy";
  const first = name.split(" ")[0];
  $("brandName").textContent = first;
  $("initial").textContent = first.slice(0, 1).toUpperCase();
  document.title = "Ask about " + first;

  const links = $("links");
  links.textContent = "";
  (candidate.links || []).filter(l => !HIDDEN_LINKS.has((l.label || "").toLowerCase())).forEach(l => {
    const a = el("a");
    a.href = l.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.append(icon(LINK_GLYPH), el("span", null, l.label));
    links.append(a);
  });
  links.style.display = links.children.length ? "" : "none";

  const list = $("projects");
  list.textContent = "";
  (candidate.projects || []).forEach(p => {
    const short = p.name.split(/\s+[—–-]\s+/)[0];
    const b = el("button", "project", short);
    b.title = p.name;
    b.addEventListener("click", () => {
      if (busy || !sessionId) return;
      input.value = "Tell me about " + short + ".";
      resize();
      send();
    });
    list.append(b);
  });
}

async function call(path, options) {
  const res = await fetch(API + path, options);
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch {}
    const err = new Error(detail);
    err.status = res.status;
    throw err;
  }
  return res;
}

async function startSession() {
  statusTag.textContent = "connecting…";
  try {
    const info = await (await call("/sessions", { method: "POST" })).json();
    sessionId = info.session_id;
    lastVerdictKey = null;
    statusTag.textContent = "";
    fillRail(info.candidate);
    showEmptyState((info.candidate.name || "Bhavyy").split(" ")[0]);
  } catch (err) {
    statusTag.textContent = "offline";
    transcript.innerHTML = "";
    addTurn("error", "Can't reach the API at " + API + ". Start it with `uv run uvicorn api:app --reload` and reload this page.");
  }
  setEnabled();
}

// Reads a Server-Sent Events stream from a fetch response and calls onEvent(name, data).
async function readEvents(res, onEvent) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buffer.indexOf("\n\n")) !== -1) {
      const block = buffer.slice(0, cut);
      buffer = buffer.slice(cut + 2);
      let name = "message", data = "";
      block.split("\n").forEach(line => {
        if (line.startsWith("event: ")) name = line.slice(7);
        else if (line.startsWith("data: ")) data += line.slice(6);
      });
      if (data) onEvent(name, JSON.parse(data));
    }
  }
}

function setFile(file) {
  if (!file) {
    pendingFile = null;
    fileChip.classList.remove("on");
    fileInput.value = "";
    setEnabled();
    return;
  }
  const ext = file.name.slice(file.name.lastIndexOf(".")).toLowerCase();
  if (![".pdf", ".docx", ".md"].includes(ext)) { addTurn("error", "Only .pdf, .docx and .md files are supported."); return; }
  if (file.size > MAX_FILE_BYTES) { addTurn("error", "That file is larger than 5 MB."); return; }
  pendingFile = file;
  fileName.textContent = file.name;
  fileChip.classList.add("on");
  setEnabled();
}

async function send() {
  const message = input.value.trim();
  if ((!message && !pendingFile) || busy || !sessionId) return;
  if (transcript.querySelector(".empty")) transcript.innerHTML = "";

  const user = addTurn("user", message || "Here is a job description.");
  const form = new FormData();
  form.append("session_id", sessionId);
  form.append("message", message);
  if (pendingFile) {
    user.body.append(el("span", "attached", "Attached: " + pendingFile.name));
    form.append("file", pendingFile);
  }
  input.value = "";
  setFile(null);
  resize();

  busy = true;
  setEnabled();

  const working = el("div", "turn");
  const indicator = el("div", "working");
  indicator.append(el("div", "pulse"));
  const label = el("span", null, "Thinking… 0s");
  indicator.append(label);
  working.append(indicator);
  transcript.append(working);
  toBottom();

  let phase = "Thinking";
  const started = Date.now();
  const showPhase = () => { label.textContent = phase + "… " + Math.round((Date.now() - started) / 1000) + "s"; };
  const tick = setInterval(showPhase, 1000);

  let answer = null, text = "";
  const ensureAnswer = () => {
    if (!answer) {
      working.remove();
      answer = addTurn("agent", "");
      answer.body.classList.add("caret");
    }
    return answer;
  };

  try {
    const res = await call("/chat", { method: "POST", body: form });
    await readEvents(res, (name, data) => {
      if (name === "status") {
        phase = data.text;
        showPhase();
        if (answer) { // text streamed before a tool call: keep it, show progress below
          answer.body.classList.remove("caret");
          answer = null;
          text = "";
          transcript.append(working);
          toBottom();
        }
      } else if (name === "token") {
        const stick = nearBottom();
        text += data.text;
        renderInto(ensureAnswer().body, text);
        if (stick) toBottom();
      } else if (name === "done") {
        if (data.match && data.jd) {
          const key = JSON.stringify([data.jd.role, data.match.score, data.match.cover_letter]);
          if (key !== lastVerdictKey) { lastVerdictKey = key; addVerdict(data.jd, data.match); }
        }
      } else if (name === "error") {
        working.remove();
        addTurn("error", data.message);
      }
    });
    working.remove();
  } catch (err) {
    working.remove();
    if (err.status === 404) { addTurn("error", err.message); startSession(); }
    else addTurn("error", err.status ? err.message : "Lost the connection to " + API + ". Check that the server is still running.");
  } finally {
    clearInterval(tick);
    if (answer) answer.body.classList.remove("caret");
    busy = false;
    setEnabled();
    input.focus();
  }
}

function setEnabled() {
  sendBtn.disabled = busy || !sessionId || (!input.value.trim() && !pendingFile);
  attachBtn.disabled = busy || !sessionId;
  resetBtn.disabled = busy;
  sendBtn.textContent = busy ? "Working" : "Send";
  document.querySelectorAll(".project").forEach(b => { b.disabled = busy || !sessionId; });
}

function resize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
}

input.addEventListener("input", () => { resize(); setEnabled(); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener("click", send);
attachBtn.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => setFile(fileInput.files[0]));
$("fileClear").addEventListener("click", () => setFile(null));

const composer = $("composer");
composer.addEventListener("dragover", e => { e.preventDefault(); composer.classList.add("drag"); });
composer.addEventListener("dragleave", () => composer.classList.remove("drag"));
composer.addEventListener("drop", e => {
  e.preventDefault();
  composer.classList.remove("drag");
  if (!busy && e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
});

// Drawer: below 900px the rail slides over the chat instead of sharing the width.
const rail = $("rail"), scrim = $("scrim"), railToggle = $("railToggle");
const isDrawer = () => window.matchMedia("(max-width: 900px)").matches;

function setRail(open) {
  rail.classList.toggle("open", open);
  scrim.classList.toggle("on", open);
  railToggle.setAttribute("aria-expanded", String(open));
  document.body.style.overflow = open ? "hidden" : "";
}

railToggle.addEventListener("click", () => setRail(!rail.classList.contains("open")));
scrim.addEventListener("click", () => setRail(false));
rail.addEventListener("click", e => { if (isDrawer() && e.target.closest("a, .project, .new-chat")) setRail(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") setRail(false); });
// Resizing past the breakpoint must not leave a stuck overlay or a locked page.
window.addEventListener("resize", () => { if (!isDrawer()) setRail(false); });

resetBtn.addEventListener("click", async () => {
  if (busy) return;
  const old = sessionId;
  sessionId = null;
  setFile(null);
  setEnabled();
  if (old) { try { await call("/sessions/" + old, { method: "DELETE" }); } catch {} }
  startSession();
});

startSession();
</script>
</body>
</html>
